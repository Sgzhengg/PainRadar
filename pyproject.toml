[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painradar"
version = "0.1.0"
description = "PainRadar: turn public comments into evidence-backed product opportunities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PainRadar" }]
dependencies = []

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
dev = ["pytest>=7"]

[project.scripts]
painradar = "painradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
